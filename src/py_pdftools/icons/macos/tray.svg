  <path d="M4 1.75 H10.5 L14.25 5.5 V16.25 H4 Z" fill="none" stroke="#000" stroke-width="1.5"
        stroke-linejoin="round"/>
  <path d="M10.25 1.75 V5.75 H14.25" fill="none" stroke="#000" stroke-width="1.25" stroke-linejoin="round"/>
  <rect x="6" y="8" width="6.25" height="2" fill="#000"/>
  <rect x="6" y="12" width="4.5" height="1.25" fill="#000"/>
</svg>
