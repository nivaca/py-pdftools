<?xml version="1.0" encoding="UTF-8"?>
<!-- py-pdftools icon: a page with what the four programs it brings together do to it: a line
     highlighted (py-annotate), a line blacked out (py-redact), its number on a label tag
     (py-foliation), and the crop marks of a sheet (py-imposition). The PNGs are made from this
     file by tools/icons.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bc8"/>
      <stop offset="1" stop-color="#1f4f8a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6ecf3"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f28a2e"/>
      <stop offset="1" stop-color="#d9650a"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg)"/>

  <!-- the crop marks of the sheet, at its four corners -->
  <g stroke="#cfe0f4" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M86 112 V86 H112"/>
    <path d="M400 86 H426 V112"/>
    <path d="M86 400 V426 H112"/>
    <path d="M400 426 H426 V400"/>
  </g>

  <!-- the page, with its shadow -->
  <rect x="136" y="114" width="240" height="304" fill="#0b2140" opacity="0.5" filter="url(#blur)"/>
  <rect x="136" y="102" width="240" height="304" fill="url(#page)"/>

  <!-- its text: a heading, a line highlighted, lines, a line blacked out -->
  <rect x="166" y="132" width="100" height="14" rx="7" fill="#b9c7d8"/>
  <rect x="160" y="166" width="190" height="26" rx="4" fill="#ffd93b"/>
  <g fill="#d3dce7">
    <rect x="166" y="174" width="176" height="10" rx="5" fill="#b49a1e"/>
    <rect x="166" y="210" width="176" height="10" rx="5"/>
    <rect x="166" y="234" width="150" height="10" rx="5"/>
    <rect x="166" y="298" width="120" height="10" rx="5"/>
  </g>
  <rect x="160" y="256" width="168" height="26" rx="3" fill="#1b1f24"/>

  <!-- the label: a tag tied to the foot of the page -->
  <path d="M300 330 H436 a14 14 0 0 1 14 14 V420 a14 14 0 0 1 -14 14 H300 L262 382 Z"
        fill="#0b2140" opacity="0.35" filter="url(#blur)"/>
  <path d="M300 318 H436 a14 14 0 0 1 14 14 V408 a14 14 0 0 1 -14 14 H300 L262 370 Z" fill="url(#tag)"/>
  <circle cx="296" cy="370" r="10" fill="#1f4f8a"/>
  <text x="378" y="403" fill="#ffffff" font-family="DejaVu Serif, Liberation Serif, Times New Roman, serif"
        font-weight="bold" font-size="88" text-anchor="middle">iv</text>
</svg>
