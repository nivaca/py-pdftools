# The installers of install/, run on Linux, macOS and Windows: each installs
# py-pdftools from this source with Python 3.14, checks what it made, runs the
# tests of the program (not those of the packaging, which are Fedora's) against
# the program installed, and uninstalls it. macOS (whose minutes count ten
# times) only for tags, on Mondays and when started by hand.
#
# For tags and when started by hand, it also makes the installers of
# tools/bundle-installer.py, each on its own system, installs each one, tries
# it and removes it:
#
#   Windows   py-pdftools-VERSION-windows-x64-setup.exe   (Inno Setup)
#   macOS     py-pdftools-VERSION-macos-arm64.dmg          (Apple Silicon)
#
# With a tag, they are added to the release of the tag once tools/release.py
# has published it (it is waited for, never made here); then tools/release.py
# --installers signs them and copies them to Codeberg. Started by hand, they
# are only kept as artifacts of the run.

name: installers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["install/**", "src/**", "tests/**", "pyproject.toml", ".github/workflows/installers.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        mac:
          - ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
        exclude:
          - os: macos-latest
            mac: false
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # (the tests choose their display by this, not by QT_QPA_PLATFORM: without it, where Xvfb is installed, as
      # on Ubuntu's runners, they start an X server and Qt's xcb plugin, which lacks libraries there and aborts)
      PY_PDFTOOLS_TEST_DISPLAY: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Libraries for Qt, and the tools the tests use (qpdf, pdftotext, tesseract)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 qpdf poppler-utils tesseract-ocr tesseract-ocr-eng
      - name: The tools the tests use (qpdf, pdftotext, tesseract)
        if: runner.os == 'macOS'
        run: brew install qpdf poppler tesseract
      - name: Install
        run: bash install/install.sh
      - name: What it made
        run: |
          set -x
          ~/.local/bin/py-pdftools --version || ~/bin/py-pdftools --version
          ~/.local/bin/py-pdftools-gui --version || ~/bin/py-pdftools-gui --version
          if [ "$RUNNER_OS" = macOS ]; then
            app=~/Applications/py-pdftools.app
            test -x "$app/Contents/MacOS/py-pdftools"
            plutil -lint "$app/Contents/Info.plist"
            test -s "$app/Contents/Resources/py-pdftools.icns"
            "$app/Contents/MacOS/py-pdftools" --version
            venv=~/"Library/Application Support/py-pdftools/venv"
          else
            desktop-file-validate ~/.local/share/applications/py-pdftools.desktop || true
            grep -q "^Exec=\"$HOME/.local/share/py-pdftools/venv/bin/py-pdftools-gui\"" ~/.local/share/applications/py-pdftools.desktop
            test -s ~/.local/share/icons/hicolor/48x48/apps/py-pdftools.png
            venv=~/.local/share/py-pdftools/venv
          fi
          echo "VENV=$venv" >> "$GITHUB_ENV"
      - name: Tests, against the program installed
        run: |
          "$VENV/bin/python" -m pip install --quiet pytest
          "$VENV/bin/python" -m pytest -q -p no:cacheprovider tests --ignore=tests/test_packaging.py
      - name: Uninstall
        run: |
          bash install/install.sh --uninstall
          test ! -e "$VENV"
          test ! -e ~/.local/bin/py-pdftools
          test ! -e ~/.local/bin/py-pdftools-gui
          test ! -e ~/Applications/py-pdftools.app
          test ! -e ~/.local/share/applications/py-pdftools.desktop

  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      # (the tests choose their display by this, not by QT_QPA_PLATFORM: without it, where Xvfb is installed, as
      # on Ubuntu's runners, they start an X server and Qt's xcb plugin, which lacks libraries there and aborts)
      PY_PDFTOOLS_TEST_DISPLAY: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (through install.bat, as a user would)
        shell: cmd
        run: install\install.bat -Desktop < nul
      - name: What it made
        shell: pwsh
        run: |
          $venv = Join-Path $env:LOCALAPPDATA "py-pdftools\venv"
          & (Join-Path $venv "Scripts\python.exe") -m py_pdftools --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path (Join-Path $venv "Scripts\py-pdftools.exe"))) { throw "no py-pdftools.exe" }
          if (-not (Test-Path (Join-Path $venv "Scripts\py-pdftools-gui.exe"))) { throw "no py-pdftools-gui.exe" }
          $link = Join-Path ([Environment]::GetFolderPath("Programs")) "py-pdftools.lnk"
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath("Desktop")) "py-pdftools.lnk"))) { throw "no desktop shortcut" }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          if ($shortcut.TargetPath -notlike "*\Scripts\pythonw.exe") { throw "shortcut to $($shortcut.TargetPath)" }
          $ico = Join-Path $env:LOCALAPPDATA "py-pdftools\py-pdftools.ico"
          $bytes = [IO.File]::ReadAllBytes($ico)
          if ($bytes[2] -ne 1 -or $bytes[4] -ne 7) { throw "the icon is not an .ico of 7 sizes" }
          "VENV=$venv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Tests, against the program installed
        shell: pwsh
        run: |
          & "$env:VENV\Scripts\python.exe" -m pip install --quiet pytest
          & "$env:VENV\Scripts\python.exe" -m pytest -q -p no:cacheprovider tests --ignore=tests/test_packaging.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: An unknown option is said to be one (not taken as the Python to use)
        shell: pwsh
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File install\install.ps1 --unisntall 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "an unknown option was accepted" }
          if ($out -notmatch "unknown option: --unisntall") { throw "it said: $out" }
          exit 0  # (GitHub ends a pwsh step with the last exit code: here, the refusal expected)
      - name: Uninstall (written as for install.sh)
        shell: cmd
        run: install\install.bat --uninstall < nul
      - name: Nothing left
        shell: pwsh
        run: |
          if (Test-Path $env:VENV) { throw "the environment is still there" }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath("Programs")) "py-pdftools.lnk")) { throw "the shortcut is still there" }

  installer-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read               # (SignPath fetches the installer from the artifacts of the run)
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Inno Setup
        shell: pwsh
        run: |
          $found = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $found) { choco install innosetup -y --no-progress }
      - name: Build the installer
        run: python tools/bundle-installer.py --system windows
      # Firmado por SignPath (CODE_SIGNING_POLICY.md), solo en una etiqueta y si el repositorio tiene las variables
      # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG y SIGNPATH_SIGNING_POLICY_SLUG y el secreto
      # SIGNPATH_API_TOKEN; cada pedido espera a que se apruebe en SignPath (hasta cuatro horas). Va con otro
      # nombre, para que el artefacto sin firmar no choque con el firmado (installer-windows, del mismo archivo).
      - name: The installer to sign
        id: unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item dist\*-windows-x64-setup.exe
          $version = $setup.Name -replace '^py-pdftools-(.+)-windows-x64-setup\.exe$', '$1'
          New-Item -ItemType Directory signing | Out-Null
          Copy-Item $setup.FullName "signing\$($setup.BaseName)-unsigned.exe"
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT
      - name: Upload it for SignPath
        id: upload-unsigned
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          path: signing/*-unsigned.exe
          archive: false
      - name: Sign it with SignPath (approved by hand)
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
          skip-decompress: true
          parameters: |
            version: ${{ toJSON(steps.unsigned.outputs.version) }}
      - name: Check the signature, and put the signed installer in its place
        if: vars.SIGNPATH_PROJECT_SLUG != '' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(Get-ChildItem signed\*.exe)
          if ($signed.Count -ne 1) { throw "signed\ has $($signed.Count) files" }
          $signature = Get-AuthenticodeSignature $signed[0].FullName
          if ($signature.Status -ne 'Valid') { throw "the signature is $($signature.Status): $($signature.StatusMessage)" }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)"
          Move-Item -Force $signed[0].FullName "dist\${{ steps.unsigned.outputs.name }}"
      - name: Install it, try it and remove it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\*-windows-x64-setup.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=openwith', '/LOG=install.log'
          $app = "$env:LOCALAPPDATA\Programs\py-pdftools"
          & "$app\python\python.exe" -s packaging\installer\check.py
          if ($LASTEXITCODE) { throw 'check.py failed' }
          $out = & "$app\python\python.exe" -s -m py_pdftools --version | Out-String
          if ($out -notmatch 'py-pdftools') { throw "--version said: $out" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\py-pdftools.lnk"
          if (-not (Test-Path $menu)) { throw 'no Start menu shortcut' }
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut($menu)
          if ($shortcut.TargetPath -notlike '*\python\pythonw.exe') { throw "the shortcut runs $($shortcut.TargetPath)" }
          if ($shortcut.Arguments -notlike '*-m py_pdftools.gui*') { throw "the shortcut runs $($shortcut.Arguments)" }
          $open = (Get-Item 'HKCU:\Software\Classes\.pdf\OpenWithProgids').GetValueNames()
          if ($open -notcontains 'py-pdftools.pdf') { throw 'not in Open with for .pdf' }
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\py-pdftools.pdf\shell\open\command').'(default)'
          if ($command -notlike '*pythonw.exe*-m py_pdftools.gui*') { throw "Open with runs $command" }
          Start-Process -Wait -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # (the uninstaller goes on in a copy of itself)
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\python"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\python") { throw 'not uninstalled' }
          if (Test-Path $menu) { throw 'the shortcut is still there' }
          if (Test-Path 'HKCU:\Software\Classes\py-pdftools.pdf') { throw 'Open with is still there' }
          $left = (Get-Item 'HKCU:\Software\Classes\.pdf\OpenWithProgids' -ErrorAction SilentlyContinue)
          if ($left -and ($left.GetValueNames() -contains 'py-pdftools.pdf')) { throw '.pdf still offers it' }
      - name: The log of the installation
        if: always()
        shell: pwsh
        run: if (Test-Path install.log) { Get-Content install.log -Tail 60 }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*.exe

  installer-macos:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - name: Build the installer
        run: python3 tools/bundle-installer.py --system macos --arch arm64
      - name: Install it, try it and remove it
        run: |
          set -ex
          dmg=$(ls dist/*-macos-arm64.dmg)
          hdiutil verify "$dmg"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          test -L "$mount/Applications"
          cp -R "$mount/py-pdftools.app" /Applications/
          hdiutil detach "$mount"
          app=/Applications/py-pdftools.app
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = 15.0
          test -s "$app/Contents/Resources/py-pdftools.icns"
          "$app/Contents/Resources/python/bin/python3" -s packaging/installer/check.py
          "$app/Contents/Resources/python/bin/python3" -s -m py_pdftools --version | grep -q py-pdftools
          rm -rf "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [installer-windows, installer-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write             # (to add them to the release)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Add them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          # tools/release.py hace la versión (con los archivos firmados) después de subir la etiqueta:
          # aquí se la espera, publicada, y nunca se hace, o las dos se harían a la vez
          draft=""
          for i in $(seq 1 120); do
            draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
            [ "$draft" = false ] && break
            sleep 30
          done
          if [ "$draft" != false ]; then
            echo "There is no release of $TAG after an hour: make it with tools/release.py, then run this again."
            exit 1
          fi
          gh release upload "$TAG" installers/* --clobber
